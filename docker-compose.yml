services:
  frontend:
    build: .
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    restart: always
    networks:
      - shared_net

networks:
  shared_net:
    external: true
