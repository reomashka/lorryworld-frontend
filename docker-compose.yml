services:
  frontend:
    build: .
    container_name: frontend
    networks:
      - shared_net
    restart: unless-stopped

  nginx:
    image: nginx:1.21.4
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: always
    networks:
      - shared_net

networks:
  shared_net:
    external: true
