services:
  frontend:
    build: .
    container_name: frontend
    volumes:
      - ./frontend/dist:/dist
    networks:
      - shared_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: always
    networks:
      - shared_net

networks:
  shared_net:
    external: true
