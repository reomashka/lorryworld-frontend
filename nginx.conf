# Ограничение частоты запросов
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Определяем протокол
map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https https;
    http  http;
}

# Geo-блокировка (опционально - раскомментируйте если нужно)
# geo $block_country {
#     default no;
#     CN yes;  # Китай
#     RU yes;  # Россия - если хотите блокировать
# }

server {
    listen 80;
    server_name lorryworld.space www.lorryworld.space;
    
    # Лимиты для HTTP
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lorryworld.space www.lorryworld.space;
    
    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/lorryworld.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lorryworld.space/privkey.pem;
    
    # Современные SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Лимиты подключений
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;
    
    # ============================================
    # ЗАЩИТА ОТ АТАК - CLOUDFLARE IP WHITELIST
    # ============================================
    # Если используете Cloudflare, раскомментируйте эти строки
    # и закомментируйте строку "# allow all;" ниже
    
    # IPv4 Cloudflare
    # allow 173.245.48.0/20;
    # allow 103.21.244.0/22;
    # allow 103.22.200.0/22;
    # allow 103.31.4.0/22;
    # allow 141.101.64.0/18;
    # allow 108.162.192.0/18;
    # allow 190.93.240.0/20;
    # allow 188.114.96.0/20;
    # allow 197.234.240.0/22;
    # allow 198.41.128.0/17;
    # allow 162.158.0.0/15;
    # allow 104.16.0.0/13;
    # allow 104.24.0.0/14;
    # allow 172.64.0.0/13;
    # allow 131.0.72.0/22;
    
    # IPv6 Cloudflare
    # allow 2400:cb00::/32;
    # allow 2606:4700::/32;
    # allow 2803:f800::/32;
    # allow 2405:b500::/32;
    # allow 2405:8100::/32;
    # allow 2a06:98c0::/29;
    # allow 2c0f:f248::/32;
    
    # Запретить все остальные (если используете whitelist выше)
    # deny all;
    
    # Если НЕ используете Cloudflare - оставьте эту строку
    # allow all;
    
    # ============================================
    # ОСНОВНЫЕ ЗАЩИТЫ
    # ============================================
    
    # Блокируем невалидные методы
    if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH)$) {
        return 444;
    }
    
    # Блокируем пустой User-Agent и боты
    if ($http_user_agent = "") {
        return 444;
    }
    
    # Блокируем известные плохие боты
    if ($http_user_agent ~* (MJ12bot|AhrefsBot|SemrushBot|DotBot|ZoominfoBot)) {
        return 444;
    }
    
    # Блокируем не-ASCII символы в URI
    if ($request_uri ~* "[^\x20-\x7E]") {
        return 444;
    }
    
    # Блокируем подозрительные запросы
    if ($request_uri ~* "(eval\(|base64_|gzinflate|preg_replace|exec\(|system\()") {
        return 444;
    }
    
    # Geo-блокировка (если раскомментировали выше)
    # if ($block_country = yes) {
    #     return 444;
    # }
    
    # ============================================
    # SECURITY HEADERS
    # ============================================
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # ============================================
    # GZIP COMPRESSION
    # ============================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_disable "msie6";
    
    # ============================================
    # BASIC SETTINGS
    # ============================================
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Редирект на HTTPS если зашли по HTTP через Cloudflare
    if ($real_scheme = http) {
        return 301 https://$host$request_uri;
    }
    
    # ============================================
    # STATIC FILES
    # ============================================
    
    location / {
        try_files $uri $uri/ /index.html;
        
        # Кэширование статических файлов
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # ============================================
    # API PROXY
    # ============================================
    
    location /api {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://backend_app:3000;
        proxy_http_version 1.1;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # ============================================
    # UPLOADS PROXY
    # ============================================
    
    location /uploads {
        limit_req zone=api burst=5 nodelay;
        
        # Ограничение размера загружаемых файлов
        client_max_body_size 10M;
        
        proxy_pass http://backend_app:3000;
        proxy_http_version 1.1;
        
        # Таймауты для загрузки файлов
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # ============================================
    # BLOCK SENSITIVE FILES
    # ============================================
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================
    # ERROR PAGES
    # ============================================
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
    }
    
    location = /50x.html {
        internal;
    }
}